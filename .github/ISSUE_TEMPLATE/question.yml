name: Question
description: Ask how to use, build or understand Wellface.
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Read the README, `docs/build.md`, `GLOSSARY.md`, the docs in `docs/` and the existing issues first (see `SUPPORT.md`).

        Problems with the Connect IQ SDK, the simulator or the watch itself belong to Garmin. Do not paste your developer key, account details or health data from your watch.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you already tried or read?
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: This issue contains no developer key, account details or personal data.
          required: true
